<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DineFlow Java</title><link rel="stylesheet" href="/style.css"></head><body><nav><a class="brand" href="/">DineFlow Java</a><a href="/">Menu</a><a href="/cart">Order</a><a href="/book">Book Table</a><a href="/track">Track Order</a><a href="/login">Login</a><a href="/register">Register</a><a href="/my-orders">My Orders</a><a href="/admin">Staff</a></nav><main><section class="hero"><h1>Restaurant ordering, without the confusion.</h1><p>Guest ordering, optional accounts, bookings and live order status.</p></section><h2>Menu</h2><div class="grid"><article class="card" th:each="i:${items}"><div class="muted" th:text="${i.category}"></div><h3 th:text="${i.name}"></h3><p class="muted" th:text="${i.description}"></p><div class="price">UGX <span th:text="${#numbers.formatDecimal(i.price,0,0)}"></span></div><br><form th:action="@{'/cart/add/'+${i.id}}" method="post"><button class="btn">Add to order</button></form></article></div></main></body></html>
